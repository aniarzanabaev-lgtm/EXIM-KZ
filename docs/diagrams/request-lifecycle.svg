<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="pendingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="approvedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rejectedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#525252"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Жизненный цикл заявки — EXIM KZ</text>
  
  <!-- Start -->
  <g transform="translate(50, 200)">
    <circle cx="30" cy="30" r="25" fill="#1a1a1a"/>
    <text x="30" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">START</text>
  </g>
  
  <!-- Arrow Start to Pending -->
  <line x1="105" y1="230" x2="170" y2="230" stroke="#525252" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="137" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#525252">Клиент</text>
  <text x="137" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#525252">создаёт</text>
  
  <!-- PENDING Status -->
  <g transform="translate(180, 170)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="url(#pendingGrad)" filter="url(#shadow)"/>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">⏳</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">PENDING</text>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Ожидает</text>
    <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Новая заявка</text>
  </g>
  
  <!-- Arrow Pending to Processing -->
  <path d="M 340 230 Q 400 230 400 310 Q 400 350 460 350" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="420" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#525252">В работу</text>
  
  <!-- PROCESSING Status -->
  <g transform="translate(470, 290)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="url(#processingGrad)" filter="url(#shadow)"/>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">🔄</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">PROCESSING</text>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">В обработке</text>
    <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Логист работает</text>
  </g>
  
  <!-- Arrow Pending to Approved (direct) -->
  <line x1="340" y1="200" x2="470" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen2)"/>
  <text x="405" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Одобрить</text>
  <defs>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
  
  <!-- Arrow Pending to Rejected (direct) -->
  <line x1="340" y1="260" x2="470" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="405" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Отклонить</text>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- APPROVED Status -->
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="url(#approvedGrad)" filter="url(#shadow)"/>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">✅</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">APPROVED</text>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Одобрена</text>
    <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Самолёт назначен</text>
  </g>
  
  <!-- Arrow Processing to Approved -->
  <path d="M 550 290 Q 550 230 560 190" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen2)"/>
  <text x="575" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Одобрить</text>
  
  <!-- Arrow Processing to Rejected -->
  <line x1="630" y1="350" x2="700" y2="350" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="665" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Отклонить</text>
  
  <!-- REJECTED Status -->
  <g transform="translate(710, 290)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="url(#rejectedGrad)" filter="url(#shadow)"/>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">❌</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">REJECTED</text>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Отклонена</text>
    <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Указана причина</text>
  </g>
  
  <!-- Arrow Approved to End -->
  <line x1="640" y1="130" x2="720" y2="130" stroke="#525252" stroke-width="2" marker-end="url(#arrowBlack)"/>
  
  <!-- Arrow Rejected to End -->
  <line x1="790" y1="290" x2="790" y2="180" stroke="#525252" stroke-width="2" marker-end="url(#arrowBlack)"/>
  
  <!-- End -->
  <g transform="translate(730, 100)">
    <circle cx="60" cy="30" r="25" fill="#1a1a1a"/>
    <circle cx="60" cy="30" r="20" fill="white"/>
    <circle cx="60" cy="30" r="15" fill="#1a1a1a"/>
    <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#525252">END</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="800" height="70" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">Легенда:</text>
    
    <rect x="100" y="12" width="20" height="20" rx="4" fill="url(#pendingGrad)"/>
    <text x="130" y="27" font-family="Arial, sans-serif" font-size="11" fill="#525252">Ожидает решения</text>
    
    <rect x="270" y="12" width="20" height="20" rx="4" fill="url(#processingGrad)"/>
    <text x="300" y="27" font-family="Arial, sans-serif" font-size="11" fill="#525252">В обработке</text>
    
    <rect x="420" y="12" width="20" height="20" rx="4" fill="url(#approvedGrad)"/>
    <text x="450" y="27" font-family="Arial, sans-serif" font-size="11" fill="#525252">Одобрена (финал)</text>
    
    <rect x="580" y="12" width="20" height="20" rx="4" fill="url(#rejectedGrad)"/>
    <text x="610" y="27" font-family="Arial, sans-serif" font-size="11" fill="#525252">Отклонена (финал)</text>
    
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#a3a3a3">* Логист может одобрить или отклонить заявку напрямую из статуса "Ожидает" или через промежуточный статус "В обработке"</text>
  </g>
</svg>